<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 140" role="img" aria-labelledby="logo-title logo-desc">
  <title id="logo-title">Thomas Wimmer Trading</title>
  <desc id="logo-desc">Premium monogram and wordmark logo for Thomas Wimmer Trading.</desc>
  <defs>
    <linearGradient id="frame-gradient" x1="8" y1="8" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F7EFE2"/>
      <stop offset="0.58" stop-color="#D8B766"/>
      <stop offset="1" stop-color="#6FA7FF"/>
    </linearGradient>
    <linearGradient id="mark-gradient" x1="24" y1="22" x2="110" y2="102" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F0D990"/>
      <stop offset="0.45" stop-color="#D8B766"/>
